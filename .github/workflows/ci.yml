name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend: Java 21 + Maven unit tests + JaCoCo ──────────────────────────────
  backend:
    name: Backend (Java 21 · Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Write settings.xml that points at the IBM Decision Intelligence Maven repo.
      # The credentials come from GitHub Secrets; the CI job will skip DI artifacts
      # if the secret is not set (e.g. on forks) and rely on the pre-built JAR in
      # samples/banking-fraud-agent/FraudDetectionService_*.jar for compilation only.
      - name: Configure Maven settings
        run: |
          if [ -f "settings.xml" ]; then
            echo "Using repository settings.xml from workspace"
          fi

      - name: Build backend and run unit tests
        env:
          MAVEN_OPTS: "--sun-misc-unsafe-memory-access=allow"
          DI_SKIP_TLS_VERIFY: "false"
        run: |
          mvn clean verify \
            --settings settings.xml \
            --batch-mode \
            --no-transfer-progress \
            -pl event-rule-backend \
            2>&1 | grep -v '^\[WARNING\] Downloaded'

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: event-rule-backend/target/site/jacoco/
          retention-days: 14

  # ── Frontend: Node.js + Vite + Vitest ─────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 · Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: event-rule-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: event-rule-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  # ── BFF: Node.js dependency install + basic lint check ───────────────────────
  bff:
    name: BFF (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: event-rule-frontend/bff

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: event-rule-frontend/bff/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Basic syntax check — catches SyntaxErrors before deployment.
      # Replace with `npm test` once BFF unit tests are added (R8).
      - name: Syntax check server.js
        run: node --check server.js

  # ── Docker: build images (no push) ────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend, bff]
    # Only run on pushes to main (not on PRs) to avoid rate limits on forks
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build BFF image
        uses: docker/build-push-action@v5
        with:
          context: ./event-rule-frontend/bff
          file: ./event-rule-frontend/bff/Dockerfile
          push: false
          tags: event-rule-bff:ci

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./event-rule-frontend
          file: ./event-rule-frontend/Dockerfile
          push: false
          tags: event-rule-frontend:ci

name: Detect Secrets

# Scans every git-tracked file with Yelp's detect-secrets and compares the result
# with the audited baseline (.secrets.baseline). Any finding that is NOT in the
# baseline fails the job.
#
# Triggers: `pull_request` (not `pull_request_target`) so that PRs from forks run
# with a read-only token and no access to repository secrets. No secrets are used
# by this workflow at all.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect secrets (detect-secrets 1.5.0)
    # `push` covers every commit pushed to this repository, on any branch, including the branches
    # of pull requests opened from it. `pull_request` is therefore only needed for forks (their
    # pushes never reach this repository): skipping same-repository pull requests avoids a
    # duplicate run of the same commits.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned version (inside the script): baseline format and plugin set are tied to the release.
      # pipx is preinstalled on GitHub-hosted Ubuntu runners. The tool reports only the file name,
      # line number and detector type of a finding, never the value.
      - name: Scan tracked files against the baseline
        run: bash .github/scripts/scan-secrets.sh

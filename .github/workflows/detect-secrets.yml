#
# Scans git-tracked files with Yelp's detect-secrets and fails when a secret
# that is not recorded in .secrets.baseline is found.
#
# To approve a false positive locally:
#   pipx install detect-secrets==1.5.0
#   detect-secrets scan --baseline .secrets.baseline
#   detect-secrets audit .secrets.baseline     # mark false positives as "n"
# or add an inline `pragma: allowlist secret` comment on the offending line.

name: Detect Secrets

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the version used to generate .secrets.baseline.
  DETECT_SECRETS_VERSION: "1.5.0"

jobs:
  detect-secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: pipx install "detect-secrets==${DETECT_SECRETS_VERSION}"

      - name: Scan tracked files against baseline
        run: |
          # detect-secrets-hook prints only the secret type and file:line,
          # never the secret value, so findings are safe to appear in logs.
          rc=0
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline || rc=$?

          case "$rc" in
            0)
              echo "No new secrets detected."
              ;;
            3)
              # No new secrets, but the baseline is stale (e.g. line numbers moved).
              echo "::warning file=.secrets.baseline::Baseline is out of date (line numbers changed). Run 'detect-secrets scan --baseline .secrets.baseline' and commit the result."
              ;;
            *)
              echo "::error::New potential secrets detected (see above). Remove them, add an inline 'pragma: allowlist secret' for false positives, or audit them into .secrets.baseline."
              exit "$rc"
              ;;
          esac

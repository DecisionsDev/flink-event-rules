# Development compose file — starts Kafka (KRaft), BFF, and Frontend only.
# The Flink job is run locally via `mvn exec:java -Pdev` or from the IDE.
# See README.md §9 for local-run instructions.

services:
  # Kafka Broker — KRaft mode (no ZooKeeper required)
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-dev-data:/var/lib/kafka/data
    networks:
      - event-rule-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # BFF - Backend-for-Frontend (Kafka to WebSocket bridge)
  bff:
    build:
      context: ./event-rule-frontend/bff
      dockerfile: Dockerfile
    container_name: event-rule-bff
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PORT: 8080
      SAMPLES_DIR: /app/samples
    ports:
      - "8080:8080"
    volumes:
      - ./samples:/app/samples:ro
    networks:
      - event-rule-network
    restart: unless-stopped

  # Frontend - React Application
  frontend:
    build:
      context: ./event-rule-frontend
      dockerfile: Dockerfile
    container_name: event-rule-frontend
    depends_on:
      - bff
    environment:
      VITE_WS_URL: ws://localhost:8080
    ports:
      - "3000:80"
    networks:
      - event-rule-network
    restart: unless-stopped

networks:
  event-rule-network:
    driver: bridge

volumes:
  kafka-dev-data:

services:
  # Kafka Broker — KRaft mode (no ZooKeeper required)
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      # Heap size configuration (50% of container memory)
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1024m"
      TOPIC_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - event-rule-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Flink JobManager
  jobmanager:
    image: ${FLINK_IMAGE}
    container_name: event-rule-backend-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
      - "6123:6123"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2.5G
        reservations:
          cpus: '0.5'
          memory: 1G
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 2048m
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 8
        parallelism.default: 1
        rest.port: 8081
        rest.address: 0.0.0.0
        execution.checkpointing.interval: 60000
        # Cluster-side initial delay guard (Apache Flink 2.0+ only; silently ignored by
        # Confluent Platform Flink 2.1.x).  The Java-API path in AgentBasedDataStreamJob
        # (CheckpointConfig.setInitialDelay) is the authoritative mechanism and works on
        # every runtime.  Both are set to the same value for defence in depth.
        execution.checkpointing.initial-delay: 300000
        execution.checkpointing.mode: AT_LEAST_ONCE
        execution.checkpointing.timeout: 300000
        execution.checkpointing.min-pause: 30000
        # Tolerate up to 10 consecutive failed checkpoints (= 600 s at 60 s interval).
        # Belt-and-suspenders: even with the initial delay, a slow restart on an emulated
        # JVM may fire a checkpoint before warm-up completes.  10 failures gives 10 min
        # of grace; the job is only terminated if failures persist past that window.
        execution.checkpointing.tolerable-failed-checkpoints: 10
        state.backend.type: rocksdb
        state.backend.rocksdb.localdir: /tmp/flink-rocksdb
        # Persist completed checkpoints to the JobManager volume so they survive restarts.
        # The path resolves inside the jobmanager container via the ./event-rule-backend/target
        # volume mount; use a dedicated subdirectory so checkpoints are not mixed with JARs.
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        heartbeat.timeout: 300000
        heartbeat.interval: 50000
        pekko.ask.timeout: 120s
        pekko.tcp.timeout: 120s
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 10 s
      - JVM_ARGS=-XX:+UseG1GC
      # Disable in-process agent chaining. Set to "true" to opt in to chaining.
      - CHAINING_ENABLED=${CHAINING_ENABLED:-false}
      # Propagate checkpoint timeout so AgentBasedDataStreamJob picks it up via longEnvOr().
      # Defaults to 300000 ms (5 min) when not set — matches execution.checkpointing.timeout above.
      - CHECKPOINT_TIMEOUT_MS=${CHECKPOINT_TIMEOUT_MS:-300000}
      # Initial delay before the FIRST checkpoint.  Must cover RocksDB native-library
      # extraction + IBM DI runner warm-up on a cold JVM.  Default: 5 × interval = 300 s.
      # Passed to CheckpointConfig.setInitialDelay() in AgentBasedDataStreamJob, which works
      # on every Flink runtime version regardless of cluster-config key support.
      - CHECKPOINT_INITIAL_DELAY_MS=${CHECKPOINT_INITIAL_DELAY_MS:-300000}
    volumes:
      - ./event-rule-backend/target:/opt/flink/usrlib
      - ./samples:/opt/flink/samples
      - ./event-rule-backend/src/main/resources/log4j2.properties:/opt/flink/conf/log4j-console.properties:ro
      - ./checkpoints:/opt/flink/checkpoints
      - ./savepoints:/opt/flink/savepoints
    networks:
      event-rule-network:
        aliases:
          - jobmanager
          - flink-jobmanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081 && echo -e \"GET /overview HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q flink-version <&3'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Flink TaskManager
  taskmanager:
    image: ${FLINK_IMAGE}
    container_name: event-rule-backend-taskmanager
    command: taskmanager
    depends_on:
      kafka:
        condition: service_healthy
      jobmanager:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3G
        reservations:
          cpus: '2.0'
          memory: 1.5G
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.memory.process.size: 2048m
        taskmanager.memory.flink.size: 1536m
        taskmanager.numberOfTaskSlots: 8
        taskmanager.registration.timeout: 10min
        taskmanager.registration.max-backoff: 30s
        # parallelism.default is a job-submission setting controlled by the JobManager.
        # It must not be set here — the TaskManager process ignores it and setting it to a
        # different value from the JobManager (which declares parallelism.default: 1) causes
        # confusing discrepancy in log diagnostics.
        heartbeat.timeout: 300000
        heartbeat.interval: 50000
        pekko.ask.timeout: 120s
        pekko.tcp.timeout: 120s
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 10 s
      - JVM_ARGS=-XX:+UseG1GC -XX:MaxGCPauseMillis=200
      # Disable in-process agent chaining. Set to "true" to opt in to chaining.
      - CHAINING_ENABLED=${CHAINING_ENABLED:-false}
    volumes:
      - ./event-rule-backend/target:/opt/flink/usrlib
      - ./samples:/opt/flink/samples
      - ./event-rule-backend/src/main/resources/log4j2.properties:/opt/flink/conf/log4j-console.properties:ro
      - ./checkpoints:/opt/flink/checkpoints
      - ./savepoints:/opt/flink/savepoints
    networks:
      event-rule-network:
        aliases:
          - taskmanager
          - flink-taskmanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/flink/bin/flink list -m jobmanager:8081 >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 90s

  # BFF - Backend-for-Frontend (Kafka to WebSocket bridge)
  bff:
    build:
      context: ./event-rule-frontend/bff
      dockerfile: Dockerfile
    container_name: event-rule-bff
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_PARTITIONS: 1
      PORT: 8080
      # Browser origin(s) allowed by CORS, e.g. http://myhost:3010 or https://myhost.
      # Empty → BFF default (http://localhost:3010).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SAMPLES_DIR: /app/samples
      FLINK_URL: http://jobmanager:8081
      JAR_PATH: /app/flink-jars/event-rule-backend-1.0-SNAPSHOT.jar
      DI_RUNTIMES: ${DI_RUNTIMES:-}
    ports:
      - "8080:8080"
    volumes:
      - ./samples:/app/samples
      - ./event-rule-backend/target:/app/flink-jars:ro
    networks:
      - event-rule-network
    restart: unless-stopped

  # Frontend - React Application
  frontend:
    build:
      context: ./event-rule-frontend
      dockerfile: Dockerfile
    container_name: event-rule-frontend
    depends_on:
      - bff
    environment:
      # Override BFF_URL_WS and BFF_URL_HTTP if the BFF is not on localhost:8080.
      # These values are substituted into the nginx CSP header at container start.
      BFF_URL_WS: ${BFF_URL_WS:-ws://localhost:8080}
      BFF_URL_HTTP: ${BFF_URL_HTTP:-http://localhost:8080}
    ports:
      - "3010:80"
    networks:
      - event-rule-network
    restart: unless-stopped

networks:
  event-rule-network:
    driver: bridge

volumes:
  # Named volume for Kafka KRaft data — survives container restarts
  kafka-data:


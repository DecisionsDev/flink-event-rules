# Flink Configuration for Event Rule Backend
# Compatible with Apache Flink 2.2.0 and SnakeYAML Engine v2

# JobManager Configuration
jobmanager.rpc.address: localhost
jobmanager.rpc.port: 6123
jobmanager.memory.process.size: 1600m

# TaskManager Configuration
taskmanager.memory.process.size: 2048m
taskmanager.numberOfTaskSlots: 8

# Parallelism
parallelism.default: 1

# High Availability (disabled for standalone mode)
high-availability.type: NONE

# Web UI
rest.port: 8081
rest.address: 0.0.0.0

# Checkpointing
execution.checkpointing.interval: 60000
execution.checkpointing.mode: EXACTLY_ONCE

# State backend — RocksDB for production workloads (spills to disk, supports large state)
# Override per-job via StateBackend API or FLINK_STATE_BACKEND env var.
state.backend.type: rocksdb
state.backend.rocksdb.localdir: /tmp/flink-rocksdb

# Classloading
# Prefer cluster-provided Flink libraries over user-jar classes to avoid mixed Flink classpaths
classloader.resolve-order: parent-first

# Logging
# Log files will be in /opt/flink/log/


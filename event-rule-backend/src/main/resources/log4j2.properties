# Log4j 2 configuration for Flink containers (Docker console mode).
#
# This file is volume-mounted as /opt/flink/conf/log4j-console.properties in
# both the jobmanager and taskmanager services (see docker-compose.yml).
# Flink's Docker entry point passes:
#   -Dlog4j.configurationFile=file:/opt/flink/conf/log4j-console.properties
# so this is the file that actually takes effect at runtime.
#
# It is a drop-in replacement for Flink's own log4j-console.properties, with
# two additions:
#   - RuleEngineRunner is set to DEBUG so every rule invocation, fired rule
#     name, elapsed time, and provider-discovery step is visible.
#   - StatefulAgentProcessor is set to DEBUG so pre/post-rule entity state and
#     result payloads (generic context format) appear in console and log file.

# Allows this configuration to be modified at runtime. The file will be
# checked every 30 seconds without requiring a container restart.
monitorInterval=30

rootLogger.level = ${env:ROOT_LOG_LEVEL:-INFO}
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.rolling.ref = RollingFileAppender

logger.ruleEngineRunner.name = com.ibm.di.event.rule.RuleEngineRunner
logger.ruleEngineRunner.level = DEBUG
logger.ruleEngineRunner.additivity = false
logger.ruleEngineRunner.appenderRef.console.ref = ConsoleAppender
logger.ruleEngineRunner.appenderRef.rolling.ref = RollingFileAppender

logger.statefulAgentProcessor.name = com.ibm.di.event.agent.StatefulAgentProcessor
logger.statefulAgentProcessor.level = DEBUG
logger.statefulAgentProcessor.additivity = false
logger.statefulAgentProcessor.appenderRef.console.ref = ConsoleAppender
logger.statefulAgentProcessor.appenderRef.rolling.ref = RollingFileAppender

logger.genericContextBuilder.name = com.ibm.di.event.agent.context.GenericContextBuilder
logger.genericContextBuilder.level = DEBUG
logger.genericContextBuilder.additivity = false
logger.genericContextBuilder.appenderRef.console.ref = ConsoleAppender
logger.genericContextBuilder.appenderRef.rolling.ref = RollingFileAppender

logger.pekko.name = org.apache.pekko
logger.pekko.level = INFO
logger.kafka.name = org.apache.kafka
logger.kafka.level = INFO
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = INFO
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = INFO
logger.shaded_zookeeper.name = org.apache.flink.shaded.zookeeper3
logger.shaded_zookeeper.level = INFO
logger.netty.name = org.jboss.netty.channel.DefaultChannelPipeline
logger.netty.level = OFF

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = ${sys:console.log.level:-ALL}

appender.rolling.name = RollingFileAppender
appender.rolling.type = RollingFile
appender.rolling.append = true
appender.rolling.fileName = ${sys:log.file}
appender.rolling.filePattern = ${sys:log.file}.%i
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 100MB
appender.rolling.policies.startup.type = OnStartupTriggeringPolicy
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = ${env:MAX_LOG_FILE_NUMBER:-10}
